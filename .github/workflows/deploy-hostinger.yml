name: Deploy to Hostinger

# Builds the static site and uploads it to Hostinger over FTP.
# Needs repo secrets FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
# (GitHub → Settings → Secrets and variables → Actions).
on:
  push:
    branches: [main]
    paths: ['nutree/**', '.github/workflows/deploy-hostinger.yml']
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nutree
    steps:
      - name: Check FTP secrets are set
        id: check
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          if [ -z "$FTP_SERVER" ]; then
            echo "FTP secrets not set yet; skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
        working-directory: .

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nutree/package-lock.json

      - name: Install dependencies
        if: steps.check.outputs.ready == 'true'
        run: npm ci

      - name: Build static site
        if: steps.check.outputs.ready == 'true'
        run: npm run build:static

      - name: Upload to Hostinger
        if: steps.check.outputs.ready == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./nutree/out/
          server-dir: ./public_html/
          exclude: |
            **/.DS_Store
